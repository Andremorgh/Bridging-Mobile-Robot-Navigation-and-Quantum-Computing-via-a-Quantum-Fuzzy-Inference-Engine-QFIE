title: "QFIE Paper Report"
description: "Bridging Mobile Robot Navigation and Quantum Computing via a Quantum Fuzzy Inference Engine — key method and results + video walkthrough."
url: "https://andremorgh.github.io"
baseurl: "/Bridging-Mobile-Robot-Navigation-and-Quantum-Computing-via-a-Quantum-Fuzzy-Inference-Engine-QFIE"

# Theme (recommended)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# Just the Docs settings
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive

# Optional: show a small "Edit this page" link (nice for transparency)
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Andremorgh/Bridging-Mobile-Robot-Navigation-and-Quantum-Computing-via-a-Quantum-Fuzzy-Inference-Engine-QFIE"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Optional: links in the top-right
aux_links:
  "GitHub repository":
    - "https://github.com/Andremorgh/Bridging-Mobile-Robot-Navigation-and-Quantum-Computing-via-a-Quantum-Fuzzy-Inference-Engine-QFIE"

# Keep Markdown predictable
markdown: kramdown
kramdown:
  input: GFM

# Avoid accidental publishing of junk files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor