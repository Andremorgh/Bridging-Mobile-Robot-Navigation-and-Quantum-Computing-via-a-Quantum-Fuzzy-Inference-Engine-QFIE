title: "PRISMA Lab · QFIE Paper Report"
description: "Paper report with key method and results + video walkthrough (PRISMA Lab, DIETI, University of Naples Federico II)."

url: "https://andremorgh.github.io"
baseurl: "/Bridging-Mobile-Robot-Navigation-and-Quantum-Computing-via-a-Quantum-Fuzzy-Inference-Engine-QFIE"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Branding
logo: "/assets/img/prismalab-logo.png"
favicon_ico: "/assets/img/prismalab-icon.ico"   # (optional) add later; see note below
