# UX / navigation
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive

# Top-right links
aux_links:
  "PRISMA Lab (UniNa)":
    - "https://prisma.dieti.unina.it/"
  "DIETI":
    - "https://www.dieti.unina.it/"
  "University of Naples Federico II":
    - "https://www.unina.it/"

# Footer (short, factual, branded)
footer_content: >
  <strong>PRISMA Lab</strong> — Projects of Industrial and Service Robotics, Mechatronics and Automation (DIETI, University of Naples Federico II).
  <span style="white-space:nowrap;">Design · Knowledge · Interaction · Impact</span>.
  Via Claudio 21, 80125 Naples, Italy.

# “Edit this page” convenience
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Andremorgh/Bridging-Mobile-Robot-Navigation-and-Quantum-Computing-via-a-Quantum-Fuzzy-Inference-Engine-QFIE"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
